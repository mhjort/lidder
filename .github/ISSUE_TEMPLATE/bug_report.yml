name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Mac model
      description: From  > About This Mac, e.g. "MacBook Pro 14-inch, M4, 2024".
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. 26.1
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output of `lidder --once`
      render: text
